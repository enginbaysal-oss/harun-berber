<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usta Berber — Randevu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #161310;
    --panel: #1F1B16;
    --panel-2: #262019;
    --cream: #F1E8D6;
    --muted: #9C9182;
    --navy: #2B3B54;
    --red: #9C2B2B;
    --red-light: #C24A4A;
    --gold: #C9A227;
    --gold-light: #E4C356;
    --line: #38312A;
    --ok: #4C8C5B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  .pole-bar{
    height:8px;
    width:100%;
    background:repeating-linear-gradient(115deg,
      var(--red) 0 18px,
      var(--cream) 18px 36px,
      var(--navy) 36px 54px);
    background-size:200% 100%;
    animation:pole-scroll 6s linear infinite;
  }
  @keyframes pole-scroll{
    from{background-position:0 0;}
    to{background-position:-108px 0;}
  }
  @media (prefers-reduced-motion: reduce){
    .pole-bar{animation:none;}
  }

  header{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(36px,8vw,54px);
    letter-spacing:2px;
    color:var(--cream);
    margin:0;
    line-height:1;
  }
  .brand span{color:var(--gold-light);}
  .tagline{
    color:var(--muted);
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:6px 0 0;
  }

  .container{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  .nav-toggle{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:5px;
    margin-bottom:24px;
  }
  .nav-toggle button{
    flex:1;
    padding:12px 10px;
    background:transparent;
    border:none;
    border-radius:9px;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .nav-toggle button.active{
    background:var(--gold);
    color:#241C08;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
  }
  .section-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;
    letter-spacing:1px;
    color:var(--gold-light);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--red);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:700;
  }

  .service-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
    gap:10px;
  }
  .service-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 12px;
    cursor:pointer;
    text-align:left;
    transition:all .12s ease;
    color:var(--cream);
  }
  .service-card:hover{border-color:var(--gold);}
  .service-card.selected{
    border-color:var(--gold);
    background:rgba(201,162,39,0.12);
  }
  .service-card .icon{font-size:22px;display:block;margin-bottom:6px;}
  .service-card .name{font-weight:600;font-size:14px;display:block;}
  .service-card .dur{color:var(--muted);font-size:12px;font-family:'Space Mono',monospace;}

  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin:14px 0 6px;
  }
  input[type=text], input[type=tel], input[type=date], select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    padding:12px 14px;
    border-radius:9px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  select{appearance:none;-webkit-appearance:none;cursor:pointer;}
  input:focus, select:focus{outline:none;border-color:var(--gold);}
  input::placeholder{color:#6B6255;}

  .slot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
    gap:8px;
    margin-top:4px;
  }
  .slot{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--cream);
    padding:10px 4px;
    border-radius:8px;
    font-family:'Space Mono',monospace;
    font-size:13px;
    text-align:center;
    cursor:pointer;
  }
  .slot:hover{border-color:var(--gold);}
  .slot.selected{background:var(--gold);color:#241C08;border-color:var(--gold);font-weight:700;}
  .slot.taken{opacity:0.25;cursor:not-allowed;text-decoration:line-through;}
  .empty-note{color:var(--muted);font-size:13px;padding:10px 0;}

  .btn{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:18px;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:repeating-linear-gradient(115deg,var(--red) 0 14px, var(--red-light) 14px 28px);
    color:var(--cream);
  }
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-secondary{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--cream);
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 14px;
    width:auto;
    margin:0;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }

  .success-box{text-align:center;padding:30px 10px;}
  .success-box .check{font-size:44px;color:var(--gold-light);margin-bottom:10px;}
  .success-box h3{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;margin:0 0 10px;color:var(--cream);}
  .summary-row{
    display:flex;justify-content:space-between;
    padding:8px 0;border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:var(--muted);}

  .pin-box{max-width:280px;margin:40px auto;text-align:center;}
  .pin-box input{text-align:center;letter-spacing:6px;font-size:20px;font-family:'Space Mono',monospace;}

  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .status-card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:14px;
  }
  .status-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;}
  .status-card .val{font-family:'Bebas Neue';font-size:20px;color:var(--gold-light);line-height:1.2;}
  .status-card .sub{font-size:12px;color:var(--muted);margin-top:2px;}

  .date-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .date-nav button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--cream);
    width:38px;height:38px;border-radius:8px;font-size:16px;cursor:pointer;
  }
  .date-nav input{flex:1;}

  .appt-row{
    display:flex;gap:12px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;
  }
  .appt-time{
    font-family:'Space Mono',monospace;font-weight:700;font-size:15px;
    color:var(--gold-light);min-width:52px;
  }
  .appt-info{flex:1;min-width:0;}
  .appt-name{font-weight:600;font-size:14px;}
  .appt-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{
    font-size:10px;text-transform:uppercase;letter-spacing:0.5px;
    padding:3px 8px;border-radius:20px;font-weight:700;
  }
  .badge.bekliyor{background:rgba(201,162,39,0.18);color:var(--gold-light);}
  .badge.tamamlandi{background:rgba(76,140,91,0.2);color:#7FC08D;}
  .badge.iptal{background:rgba(156,43,43,0.2);color:var(--red-light);}
  .appt-actions{display:flex;gap:6px;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:13px;
  }
  .icon-btn:hover{border-color:var(--gold);color:var(--gold-light);}

  .empty-list{text-align:center;color:var(--muted);padding:30px 0;font-size:14px;}

  .chip-row{display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13px;}
  .day-closed-badge{
    display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    padding:3px 9px;border-radius:20px;font-weight:700;
    background:rgba(156,43,43,0.2);color:var(--red-light);margin-left:8px;
  }
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .summary-box{
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 6px;text-align:center;
  }
  .summary-box .n{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold-light);line-height:1;}
  .summary-box .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}

  .toggle-add{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
  }
  .refresh-line{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--muted);margin-bottom:14px;
  }

  .hidden{display:none !important;}

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,8,6,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:100;
  }
  .modal-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    width:100%; max-width:400px;
    max-height:90vh; overflow-y:auto;
    animation:modal-up .18s ease;
  }
  @keyframes modal-up{
    from{ transform:translateY(16px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  .modal-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .modal-date{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  .modal-time{
    font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--gold-light); line-height:1.1; margin-top:2px;
  }
</style>
</head>
<body>

<div class="pole-bar"></div>
<header>
  <h1 class="brand">USTA <span>BERBER</span></h1>
  <p class="tagline">Randevu Sistemi</p>
</header>

<div class="container">

  <div class="nav-toggle">
    <button id="tabCustomer" class="active">Randevu Al</button>
    <button id="tabBarber">Berber Paneli</button>
  </div>

  <!-- CUSTOMER VIEW -->
  <div id="viewCustomer">

    <div id="bookingForm">
      <div class="card">
        <p class="section-title">Randevu Al</p>
        <label>Tarih</label>
        <input type="date" id="dateInput">
        <label>Saat Seç</label>
        <div class="slot-grid" id="slotGrid"></div>
        <p class="empty-note" style="text-align:center;">Bir saate dokunarak randevunuzu tamamlayın</p>
      </div>
    </div>

    <div id="successView" class="card hidden">
      <div class="success-box">
        <div class="check">✓</div>
        <h3>Randevunuz Alındı</h3>
      </div>
      <div id="summaryBox"></div>
      <button class="btn btn-secondary" id="newBookingBtn">Yeni Randevu Oluştur</button>
    </div>

  </div>

  <!-- BARBER VIEW -->
  <div id="viewBarber" class="hidden">

    <div id="pinGate" class="pin-box">
      <p class="section-title" style="justify-content:center;">Berber Girişi</p>
      <input type="text" id="pinInput" placeholder="PIN" maxlength="6">
      <button class="btn btn-primary" id="pinSubmit">Giriş Yap</button>
      <p style="color:var(--muted);font-size:12px;margin-top:12px;">Varsayılan PIN: 4545</p>
    </div>

    <div id="barberPanel" class="hidden">

      <div class="refresh-line">
        <span id="lastUpdated">—</span>
        <button class="btn-ghost" id="refreshBtn">Yenile</button>
      </div>

      <div class="status-grid">
        <div class="status-card">
          <div class="lbl">Şu An</div>
          <div class="val" id="nowVal">—</div>
          <div class="sub" id="nowSub"></div>
        </div>
        <div class="status-card">
          <div class="lbl">Sıradaki</div>
          <div class="val" id="nextVal">—</div>
          <div class="sub" id="nextSub"></div>
        </div>
      </div>

      <div class="card">
        <div class="date-nav">
          <button id="prevDay">‹</button>
          <input type="date" id="barberDate">
          <button id="nextDay">›</button>
          <button class="btn-ghost" id="toggleDayClosedBtn" style="white-space:nowrap;">Günü Kapat</button>
        </div>
        <div id="dayClosedNote" class="empty-note hidden">Bu gün kapalı — müşteriler randevu alamaz.</div>

        <div class="summary-grid" id="summaryGrid"></div>

        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="btn-ghost" id="exportTxtBtn" style="flex:1;">📄 TXT İndir</button>
          <button class="btn-ghost" id="exportPdfBtn" style="flex:1;">🧾 PDF İndir</button>
        </div>
      </div>

      <div class="card">
        <p class="section-title">Randevu Listesi</p>
        <div id="apptList"></div>
      </div>

      <div class="card">
        <div class="toggle-add" id="quickAddToggle">
          <p class="section-title" style="margin:0;">Hızlı Randevu Ekle</p>
          <span id="quickAddArrow" style="color:var(--muted);">▾</span>
        </div>

        <div id="quickAddBody" class="hidden" style="margin-top:12px;">
          <label>Ad Soyad</label>
          <input type="text" id="qaName" placeholder="Müşteri adı">
          <label>Telefon</label>
          <input type="tel" id="qaPhone" placeholder="05XX XXX XX XX">
          <label>Hizmet</label>
          <div class="service-grid" id="qaServiceGrid"></div>
          <label>Saat</label>
          <div class="slot-grid" id="qaSlotGrid"></div>
          <button class="btn btn-primary" id="qaSubmit" disabled>Randevuyu Ekle</button>
        </div>
      </div>

      <div class="card">
        <div class="toggle-add" id="settingsToggle">
          <p class="section-title" style="margin:0;">Çalışma Saatleri ve Ayarlar</p>
          <span id="settingsArrow" style="color:var(--muted);">▾</span>
        </div>

        <div id="settingsBody" class="hidden" style="margin-top:12px;">
          <div class="settings-grid">
            <div>
              <label>Açılış Saati</label>
              <select id="openHourSelect"></select>
            </div>
            <div>
              <label>Kapanış Saati</label>
              <select id="closeHourSelect"></select>
            </div>
          </div>
          <label>Randevu Aralığı</label>
          <select id="slotMinutesSelect">
            <option value="15">15 dakika</option>
            <option value="20">20 dakika</option>
            <option value="30">30 dakika</option>
            <option value="45">45 dakika</option>
            <option value="60">60 dakika</option>
          </select>
          <button class="btn btn-secondary" id="saveSettingsBtn">Ayarları Kaydet</button>

          <label style="margin-top:22px;">Kapalı Günler</label>
          <div style="display:flex;gap:8px;">
            <input type="date" id="closeDayInput">
            <button class="btn-ghost" id="addCloseDayBtn" style="white-space:nowrap;">Ekle</button>
          </div>
          <div id="closedDaysList" style="margin-top:10px;"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<div id="bookingModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <div class="modal-date" id="modalDateLabel"></div>
        <div class="modal-time" id="modalTimeLabel"></div>
      </div>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>

    <label>Yapılacak İşlem</label>
    <select id="modalServiceSelect"></select>

    <label>Ad Soyad</label>
    <input type="text" id="modalName" placeholder="Ahmet Yılmaz">

    <label>Telefon</label>
    <input type="tel" id="modalPhone" placeholder="05XX XXX XX XX">

    <button class="btn btn-primary" id="modalSubmit" disabled>Randevu Al</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY = "appointments";
const SETTINGS_KEY = "settings";
const BARBER_PIN = "4545";

let SETTINGS = {
  openHour: 9,
  closeHour: 20,
  slotMinutes: 30,
  closedDates: []
};

const SERVICES = [
  {id:"sac", name:"Saç Kesimi", dur:30, icon:"✂️"},
  {id:"sakal", name:"Sakal Tıraşı", dur:20, icon:"🪒"},
  {id:"sacsakal", name:"Saç + Sakal", dur:45, icon:"💈"},
  {id:"cocuk", name:"Çocuk Kesimi", dur:30, icon:"👦"},
  {id:"cilt", name:"Cilt Bakımı", dur:30, icon:"🧴"}
];

let state = {
  customer: { service:null, date:null, time:null },
  quickAdd: { service:null, time:null },
  barberDate: null,
  authed: false
};

async function loadSettings(){
  try{
    const res = await window.storage.get(SETTINGS_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      SETTINGS = Object.assign({}, SETTINGS, parsed);
      if(!Array.isArray(SETTINGS.closedDates)) SETTINGS.closedDates = [];
    }
  }catch(e){
    // no settings saved yet, defaults stay
  }
}
async function saveSettings(){
  try{
    await window.storage.set(SETTINGS_KEY, JSON.stringify(SETTINGS), true);
  }catch(e){
    console.error("Ayarlar kaydedilemedi", e);
  }
}

function pad(n){ return n.toString().padStart(2,"0"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function timeToMinutes(t){
  const [h,m] = t.split(":").map(Number);
  return h*60+m;
}
function serviceName(id){
  const s = SERVICES.find(s=>s.id===id);
  return s ? s.name : id;
}
function serviceDur(id){
  const s = SERVICES.find(s=>s.id===id);
  return s ? s.dur : 30;
}
function fmtDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
}

function generateSlots(dateStr){
  if(SETTINGS.closedDates.includes(dateStr)) return [];
  const slots = [];
  for(let m = SETTINGS.openHour*60; m < SETTINGS.closeHour*60; m += SETTINGS.slotMinutes){
    slots.push(pad(Math.floor(m/60))+":"+pad(m%60));
  }
  if(dateStr === todayStr()){
    const nm = nowMinutes();
    return slots.filter(s => timeToMinutes(s) > nm);
  }
  return slots;
}

async function loadAppointments(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(!res || !res.value) return [];
    return JSON.parse(res.value);
  }catch(e){
    return [];
  }
}
async function saveAppointments(list){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(list), true);
  }catch(e){
    console.error("Kaydetme hatası", e);
  }
}
function newId(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
}

function renderServiceGrid(container, selectedId, onSelect){
  container.innerHTML = "";
  SERVICES.forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "service-card" + (selectedId===s.id ? " selected":"");
    btn.innerHTML = `<span class="icon">${s.icon}</span><span class="name">${s.name}</span><span class="dur">${s.dur} dk</span>`;
    btn.onclick = ()=> onSelect(s.id);
    container.appendChild(btn);
  });
}

function makeServiceSelector(containerId, getSelected, setSelected, afterFn){
  function render(){
    renderServiceGrid(document.getElementById(containerId), getSelected(), (id)=>{
      setSelected(id);
      render();
      if(afterFn) afterFn();
    });
  }
  render();
}

async function renderSlotGrid(container, dateStr, selectedTime, onSelect){
  container.innerHTML = "<div class='empty-note'>Yükleniyor...</div>";
  const all = await loadAppointments();
  const booked = new Set(all.filter(a=>a.date===dateStr && a.status!=="iptal").map(a=>a.time));
  const slots = generateSlots(dateStr);
  container.innerHTML = "";
  if(slots.length===0){
    const msg = SETTINGS.closedDates.includes(dateStr) ? "Bu gün berber kapalı." : "Bu tarih için müsait saat yok.";
    container.innerHTML = `<div class='empty-note'>${msg}</div>`;
    return;
  }
  slots.forEach(t=>{
    const btn = document.createElement("button");
    const taken = booked.has(t);
    btn.className = "slot" + (t===selectedTime ? " selected":"") + (taken ? " taken":"");
    btn.textContent = t;
    if(taken){
      btn.disabled = true;
    }else{
      btn.onclick = ()=> onSelect(t);
    }
    container.appendChild(btn);
  });
}

function populateServiceSelect(selectEl, onChange){
  selectEl.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Hizmet seçin...";
  placeholder.disabled = true;
  placeholder.selected = true;
  selectEl.appendChild(placeholder);
  SERVICES.forEach(s=>{
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = `${s.icon} ${s.name} (${s.dur} dk)`;
    selectEl.appendChild(opt);
  });
  selectEl.onchange = ()=> onChange(selectEl.value);
}

function initCustomerView(){
  const dateInput = document.getElementById("dateInput");
  const today = todayStr();
  dateInput.min = today;
  const maxD = new Date(); maxD.setDate(maxD.getDate()+21);
  dateInput.max = maxD.getFullYear()+"-"+pad(maxD.getMonth()+1)+"-"+pad(maxD.getDate());
  dateInput.value = today;
  state.customer.date = today;
  dateInput.onchange = async ()=>{
    state.customer.date = dateInput.value;
    await loadCustomerSlots();
  };

  document.getElementById("newBookingBtn").onclick = resetBookingForm;

  document.getElementById("modalClose").onclick = closeBookingModal;
  document.getElementById("bookingModal").onclick = (e)=>{
    if(e.target.id === "bookingModal") closeBookingModal();
  };
  document.getElementById("modalName").oninput = validateModalForm;
  document.getElementById("modalPhone").oninput = validateModalForm;
  document.getElementById("modalSubmit").onclick = submitBooking;

  loadCustomerSlots();
}

async function loadCustomerSlots(){
  const container = document.getElementById("slotGrid");
  await renderSlotGrid(container, state.customer.date, null, (t)=>{
    openBookingModal(t);
  });
}

function openBookingModal(time){
  state.customer.time = time;
  state.customer.service = null;
  document.getElementById("modalDateLabel").textContent = fmtDate(state.customer.date);
  document.getElementById("modalTimeLabel").textContent = time;
  document.getElementById("modalName").value = "";
  document.getElementById("modalPhone").value = "";
  populateServiceSelect(document.getElementById("modalServiceSelect"), (id)=>{
    state.customer.service = id;
    validateModalForm();
  });
  document.getElementById("modalSubmit").disabled = true;
  document.getElementById("modalSubmit").textContent = "Randevu Al";
  document.getElementById("bookingModal").classList.remove("hidden");
}

function closeBookingModal(){
  document.getElementById("bookingModal").classList.add("hidden");
}

function validateModalForm(){
  const name = document.getElementById("modalName").value.trim();
  const phone = document.getElementById("modalPhone").value.trim();
  const ok = state.customer.service && name.length>1 && phone.length>=7;
  document.getElementById("modalSubmit").disabled = !ok;
}

async function submitBooking(){
  const btn = document.getElementById("modalSubmit");
  btn.disabled = true;
  btn.textContent = "Kaydediliyor...";

  const name = document.getElementById("modalName").value.trim();
  const phone = document.getElementById("modalPhone").value.trim();

  const list = await loadAppointments();
  const conflict = list.some(a=>a.date===state.customer.date && a.time===state.customer.time && a.status!=="iptal");
  if(conflict){
    alert("Bu saat az önce başkası tarafından alındı. Lütfen başka bir saat seçin.");
    closeBookingModal();
    await loadCustomerSlots();
    return;
  }

  const appt = {
    id: newId(),
    name, phone,
    service: state.customer.service,
    date: state.customer.date,
    time: state.customer.time,
    status: "bekliyor",
    addedBy: "musteri",
    createdAt: Date.now()
  };
  list.push(appt);
  await saveAppointments(list);

  document.getElementById("summaryBox").innerHTML = `
    <div class="summary-row"><span class="k">Ad Soyad</span><span>${name}</span></div>
    <div class="summary-row"><span class="k">Telefon</span><span>${phone}</span></div>
    <div class="summary-row"><span class="k">Hizmet</span><span>${serviceName(appt.service)}</span></div>
    <div class="summary-row"><span class="k">Tarih</span><span>${fmtDate(appt.date)}</span></div>
    <div class="summary-row"><span class="k">Saat</span><span>${appt.time}</span></div>
  `;
  closeBookingModal();
  document.getElementById("bookingForm").classList.add("hidden");
  document.getElementById("successView").classList.remove("hidden");
  btn.textContent = "Randevu Al";
}

function resetBookingForm(){
  state.customer = { service:null, date: todayStr(), time:null };
  document.getElementById("dateInput").value = todayStr();
  document.getElementById("successView").classList.add("hidden");
  document.getElementById("bookingForm").classList.remove("hidden");
  initCustomerView();
}

// ---------- BARBER VIEW ----------

function switchTab(tab){
  const isCustomer = tab==="customer";
  document.getElementById("tabCustomer").classList.toggle("active", isCustomer);
  document.getElementById("tabBarber").classList.toggle("active", !isCustomer);
  document.getElementById("viewCustomer").classList.toggle("hidden", !isCustomer);
  document.getElementById("viewBarber").classList.toggle("hidden", isCustomer);
}

document.getElementById("tabCustomer").onclick = ()=> switchTab("customer");
document.getElementById("tabBarber").onclick = ()=> switchTab("barber");

document.getElementById("pinSubmit").onclick = async ()=>{
  const val = document.getElementById("pinInput").value.trim();
  if(val === BARBER_PIN){
    state.authed = true;
    document.getElementById("pinGate").classList.add("hidden");
    document.getElementById("barberPanel").classList.remove("hidden");
    await loadSettings();
    initBarberView();
  }else{
    alert("PIN hatalı.");
  }
};
document.getElementById("pinInput").onkeydown = (e)=>{
  if(e.key === "Enter") document.getElementById("pinSubmit").click();
};

let barberPollTimer = null;

function initBarberView(){
  state.barberDate = todayStr();
  document.getElementById("barberDate").value = state.barberDate;
  document.getElementById("barberDate").onchange = (e)=>{
    state.barberDate = e.target.value;
    refreshBarberList();
    refreshQuickAddSlots();
    updateDayClosedUI();
  };
  document.getElementById("prevDay").onclick = ()=> shiftBarberDate(-1);
  document.getElementById("nextDay").onclick = ()=> shiftBarberDate(1);
  document.getElementById("refreshBtn").onclick = refreshBarberList;
  document.getElementById("toggleDayClosedBtn").onclick = toggleSelectedDayClosed;
  document.getElementById("exportTxtBtn").onclick = ()=> exportSummary("txt");
  document.getElementById("exportPdfBtn").onclick = ()=> exportSummary("pdf");

  document.getElementById("quickAddToggle").onclick = ()=>{
    const body = document.getElementById("quickAddBody");
    body.classList.toggle("hidden");
    document.getElementById("quickAddArrow").textContent = body.classList.contains("hidden") ? "▾" : "▴";
  };

  document.getElementById("settingsToggle").onclick = ()=>{
    const body = document.getElementById("settingsBody");
    body.classList.toggle("hidden");
    document.getElementById("settingsArrow").textContent = body.classList.contains("hidden") ? "▾" : "▴";
  };

  makeServiceSelector("qaServiceGrid",
    ()=> state.quickAdd.service,
    (id)=>{ state.quickAdd.service = id; },
    validateQuickAdd);
  document.getElementById("qaName").oninput = validateQuickAdd;
  document.getElementById("qaPhone").oninput = validateQuickAdd;
  document.getElementById("qaSubmit").onclick = submitQuickAdd;

  initSettingsPanel();
  updateDayClosedUI();
  refreshBarberList();
  refreshQuickAddSlots();

  if(barberPollTimer) clearInterval(barberPollTimer);
  barberPollTimer = setInterval(()=>{
    if(!document.getElementById("viewBarber").classList.contains("hidden") && state.authed){
      refreshBarberList();
    }
  }, 8000);
}

function shiftBarberDate(delta){
  const d = new Date(state.barberDate+"T00:00:00");
  d.setDate(d.getDate()+delta);
  state.barberDate = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  document.getElementById("barberDate").value = state.barberDate;
  refreshBarberList();
  refreshQuickAddSlots();
  updateDayClosedUI();
}

function updateDayClosedUI(){
  const closed = SETTINGS.closedDates.includes(state.barberDate);
  document.getElementById("toggleDayClosedBtn").textContent = closed ? "Günü Aç" : "Günü Kapat";
  document.getElementById("dayClosedNote").classList.toggle("hidden", !closed);
}

async function toggleSelectedDayClosed(){
  const idx = SETTINGS.closedDates.indexOf(state.barberDate);
  if(idx === -1){
    SETTINGS.closedDates.push(state.barberDate);
  }else{
    SETTINGS.closedDates.splice(idx, 1);
  }
  await saveSettings();
  updateDayClosedUI();
  renderClosedDaysList();
  await refreshQuickAddSlots();
}

function populateHourSelect(selectEl, selectedHour){
  selectEl.innerHTML = "";
  for(let h=0; h<24; h++){
    const opt = document.createElement("option");
    opt.value = h;
    opt.textContent = pad(h)+":00";
    if(h === selectedHour) opt.selected = true;
    selectEl.appendChild(opt);
  }
}

function initSettingsPanel(){
  const openSel = document.getElementById("openHourSelect");
  const closeSel = document.getElementById("closeHourSelect");
  const slotSel = document.getElementById("slotMinutesSelect");

  populateHourSelect(openSel, SETTINGS.openHour);
  populateHourSelect(closeSel, SETTINGS.closeHour);
  slotSel.value = String(SETTINGS.slotMinutes);

  document.getElementById("saveSettingsBtn").onclick = async ()=>{
    const newOpen = Number(openSel.value);
    const newClose = Number(closeSel.value);
    if(newClose <= newOpen){
      alert("Kapanış saati açılış saatinden sonra olmalı.");
      return;
    }
    SETTINGS.openHour = newOpen;
    SETTINGS.closeHour = newClose;
    SETTINGS.slotMinutes = Number(slotSel.value);
    await saveSettings();
    await refreshQuickAddSlots();
    alert("Çalışma saatleri kaydedildi.");
  };

  const closeDayInput = document.getElementById("closeDayInput");
  closeDayInput.min = todayStr();
  document.getElementById("addCloseDayBtn").onclick = async ()=>{
    const val = closeDayInput.value;
    if(!val) return;
    if(!SETTINGS.closedDates.includes(val)){
      SETTINGS.closedDates.push(val);
      SETTINGS.closedDates.sort();
      await saveSettings();
      renderClosedDaysList();
      if(val === state.barberDate){
        updateDayClosedUI();
        await refreshQuickAddSlots();
      }
    }
    closeDayInput.value = "";
  };

  renderClosedDaysList();
}

function renderClosedDaysList(){
  const container = document.getElementById("closedDaysList");
  container.innerHTML = "";
  if(SETTINGS.closedDates.length === 0){
    container.innerHTML = "<div class='empty-note'>Kapalı gün yok.</div>";
    return;
  }
  SETTINGS.closedDates.forEach(dateStr=>{
    const row = document.createElement("div");
    row.className = "chip-row";
    row.innerHTML = `<span>${fmtDate(dateStr)}</span>`;
    const removeBtn = document.createElement("button");
    removeBtn.className = "icon-btn";
    removeBtn.textContent = "✕";
    removeBtn.title = "Kapalı günü kaldır";
    removeBtn.onclick = async ()=>{
      SETTINGS.closedDates = SETTINGS.closedDates.filter(d=>d!==dateStr);
      await saveSettings();
      renderClosedDaysList();
      if(dateStr === state.barberDate){
        updateDayClosedUI();
        await refreshQuickAddSlots();
      }
    };
    row.appendChild(removeBtn);
    container.appendChild(row);
  });
}

async function refreshQuickAddSlots(){
  await renderSlotGrid(document.getElementById("qaSlotGrid"), state.barberDate, state.quickAdd.time, async (t)=>{
    state.quickAdd.time = t;
    await refreshQuickAddSlots();
    validateQuickAdd();
  });
}

function validateQuickAdd(){
  const name = document.getElementById("qaName").value.trim();
  const ok = state.quickAdd.service && state.quickAdd.time && name.length>1;
  document.getElementById("qaSubmit").disabled = !ok;
}

async function submitQuickAdd(){
  const name = document.getElementById("qaName").value.trim();
  const phone = document.getElementById("qaPhone").value.trim();
  const list = await loadAppointments();
  const conflict = list.some(a=>a.date===state.barberDate && a.time===state.quickAdd.time && a.status!=="iptal");
  if(conflict){
    alert("Bu saat dolu.");
    return;
  }
  list.push({
    id: newId(),
    name, phone: phone || "-",
    service: state.quickAdd.service,
    date: state.barberDate,
    time: state.quickAdd.time,
    status: "bekliyor",
    addedBy: "berber",
    createdAt: Date.now()
  });
  await saveAppointments(list);
  document.getElementById("qaName").value = "";
  document.getElementById("qaPhone").value = "";
  state.quickAdd = {service:null, time:null};
  makeServiceSelector("qaServiceGrid",
    ()=> state.quickAdd.service,
    (id)=>{ state.quickAdd.service = id; },
    validateQuickAdd);
  document.getElementById("qaSubmit").disabled = true;
  await refreshQuickAddSlots();
  await refreshBarberList();
}

async function setStatus(id, status){
  const list = await loadAppointments();
  const item = list.find(a=>a.id===id);
  if(item){
    item.status = status;
    await saveAppointments(list);
    await refreshBarberList();
    await refreshQuickAddSlots();
  }
}

function downloadBlob(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toAsciiTr(s){
  if(s===null || s===undefined) return s;
  const map = {'ç':'c','Ç':'C','ğ':'g','Ğ':'G','ı':'i','İ':'I','ö':'o','Ö':'O','ş':'s','Ş':'S','ü':'u','Ü':'U'};
  return String(s).replace(/[çÇğĞıİöÖşŞüÜ]/g, ch => map[ch] || ch);
}

async function exportSummary(format){
  const list = await loadAppointments();
  const dayList = list
    .filter(a=>a.date===state.barberDate)
    .sort((a,b)=> timeToMinutes(a.time)-timeToMinutes(b.time));

  const dateLabel = fmtDate(state.barberDate);
  const counts = {
    total: dayList.length,
    bekliyor: dayList.filter(a=>a.status==="bekliyor").length,
    tamamlandi: dayList.filter(a=>a.status==="tamamlandı").length,
    iptal: dayList.filter(a=>a.status==="iptal").length
  };

  if(format === "txt"){
    const lines = [];
    lines.push("USTA BERBER — Günlük Randevu Özeti");
    lines.push("Tarih: " + dateLabel);
    lines.push("");
    lines.push(`Toplam: ${counts.total}   Bekliyor: ${counts.bekliyor}   Tamamlandı: ${counts.tamamlandi}   İptal: ${counts.iptal}`);
    lines.push("-".repeat(62));
    if(dayList.length===0){
      lines.push("Bu tarih için randevu yok.");
    }else{
      dayList.forEach(a=>{
        lines.push(`${a.time}  ${a.name.padEnd(20)}  ${serviceName(a.service).padEnd(16)}  ${(a.phone||"-").padEnd(14)}  ${a.status}`);
      });
    }
    const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
    downloadBlob(`randevu-ozeti-${state.barberDate}.txt`, blob);
    return;
  }

  // PDF export
  if(!window.jspdf){
    alert("PDF oluşturucu yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 18;

  doc.setFontSize(16);
  doc.text("USTA BERBER", 14, y); y += 8;
  doc.setFontSize(11);
  doc.text("Gunluk Randevu Ozeti", 14, y); y += 6;
  doc.text("Tarih: " + toAsciiTr(dateLabel), 14, y); y += 10;

  doc.setFontSize(10);
  doc.text(`Toplam: ${counts.total}   Bekliyor: ${counts.bekliyor}   Tamamlandi: ${counts.tamamlandi}   Iptal: ${counts.iptal}`, 14, y);
  y += 8;
  doc.setDrawColor(180);
  doc.line(14, y, 196, y);
  y += 8;

  if(dayList.length===0){
    doc.text("Bu tarih icin randevu yok.", 14, y);
  }else{
    doc.setFont(undefined, "bold");
    doc.text("Saat", 14, y);
    doc.text("Ad Soyad", 34, y);
    doc.text("Hizmet", 94, y);
    doc.text("Telefon", 140, y);
    doc.text("Durum", 172, y);
    doc.setFont(undefined, "normal");
    y += 6;
    doc.setDrawColor(220);
    doc.line(14, y-4, 196, y-4);

    dayList.forEach(a=>{
      if(y > 280){ doc.addPage(); y = 20; }
      doc.text(a.time, 14, y);
      doc.text(toAsciiTr(a.name).slice(0,28), 34, y);
      doc.text(toAsciiTr(serviceName(a.service)).slice(0,20), 94, y);
      doc.text(String(a.phone || "-"), 140, y);
      doc.text(toAsciiTr(a.status), 172, y);
      y += 6;
    });
  }

  doc.save(`randevu-ozeti-${state.barberDate}.pdf`);
}

function renderSummary(dayList){
  const total = dayList.length;
  const bekliyor = dayList.filter(a=>a.status==="bekliyor").length;
  const tamamlandi = dayList.filter(a=>a.status==="tamamlandı").length;
  const iptal = dayList.filter(a=>a.status==="iptal").length;

  document.getElementById("summaryGrid").innerHTML = `
    <div class="summary-box"><div class="n">${total}</div><div class="l">Toplam</div></div>
    <div class="summary-box"><div class="n">${bekliyor}</div><div class="l">Bekliyor</div></div>
    <div class="summary-box"><div class="n">${tamamlandi}</div><div class="l">Tamamlandı</div></div>
    <div class="summary-box"><div class="n">${iptal}</div><div class="l">İptal</div></div>
  `;
}

async function refreshBarberList(){
  const list = await loadAppointments();
  const dayList = list
    .filter(a=>a.date===state.barberDate)
    .sort((a,b)=> timeToMinutes(a.time) - timeToMinutes(b.time));

  renderSummary(dayList);

  const container = document.getElementById("apptList");
  container.innerHTML = "";
  if(dayList.length===0){
    container.innerHTML = "<div class='empty-list'>Bu tarih için randevu yok.</div>";
  }else{
    dayList.forEach(a=>{
      const row = document.createElement("div");
      row.className = "appt-row";
      row.innerHTML = `
        <div class="appt-time">${a.time}</div>
        <div class="appt-info">
          <div class="appt-name">${a.name}</div>
          <div class="appt-meta">${serviceName(a.service)} · ${a.phone || "-"} <span class="badge ${a.status==='tamamlandı'?'tamamlandi':a.status}">${a.status}</span></div>
        </div>
        <div class="appt-actions"></div>
      `;
      const actions = row.querySelector(".appt-actions");
      if(a.status === "bekliyor"){
        const doneBtn = document.createElement("button");
        doneBtn.className = "icon-btn";
        doneBtn.textContent = "✓";
        doneBtn.title = "Tamamlandı olarak işaretle";
        doneBtn.onclick = ()=> setStatus(a.id, "tamamlandı");
        const cancelBtn = document.createElement("button");
        cancelBtn.className = "icon-btn";
        cancelBtn.textContent = "✕";
        cancelBtn.title = "İptal et";
        cancelBtn.onclick = ()=> setStatus(a.id, "iptal");
        actions.appendChild(doneBtn);
        actions.appendChild(cancelBtn);
      }else{
        const undoBtn = document.createElement("button");
        undoBtn.className = "icon-btn";
        undoBtn.textContent = "↺";
        undoBtn.title = "Bekliyor durumuna al";
        undoBtn.onclick = ()=> setStatus(a.id, "bekliyor");
        actions.appendChild(undoBtn);
      }
      container.appendChild(row);
    });
  }

  updateStatusBanner(list);
  const d = new Date();
  document.getElementById("lastUpdated").textContent = "Son güncelleme: " + pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function updateStatusBanner(list){
  const today = todayStr();
  const nm = nowMinutes();
  const todays = list.filter(a=>a.date===today && a.status==="bekliyor")
    .sort((a,b)=> timeToMinutes(a.time)-timeToMinutes(b.time));

  let current = null, next = null;
  for(const a of todays){
    const start = timeToMinutes(a.time);
    const end = start + serviceDur(a.service);
    if(nm >= start && nm < end){
      current = a;
    }else if(start > nm && !next){
      next = a;
    }
  }

  const nowVal = document.getElementById("nowVal");
  const nowSub = document.getElementById("nowSub");
  if(current){
    nowVal.textContent = current.name;
    nowSub.textContent = serviceName(current.service) + " · " + current.time;
  }else{
    nowVal.textContent = "Müsait";
    nowSub.textContent = "Şu an randevu yok";
  }

  const nextVal = document.getElementById("nextVal");
  const nextSub = document.getElementById("nextSub");
  if(next){
    nextVal.textContent = next.time;
    nextSub.textContent = next.name + " · " + serviceName(next.service);
  }else{
    nextVal.textContent = "—";
    nextSub.textContent = "Bugün için randevu kalmadı";
  }
}

(async function init(){
  await loadSettings();
  initCustomerView();
})();
</script>
