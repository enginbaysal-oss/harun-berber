<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harun Berber — Randevu Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1917;
    --surface: #242220;
    --surface-2: #2c2925;
    --border: #3a3631;
    --gold: #c9a24b;
    --gold-dim: #8f7333;
    --red: #a83a2e;
    --blue: #3a5f80;
    --text: #f3eee3;
    --muted: #a69c8d;
    --green: #6f9d6a;
    --danger: #b5453b;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;}
  #app{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .stripe-bar{
    height:6px;
    width:100%;
    background:repeating-linear-gradient(
      -45deg,
      var(--gold) 0 10px,
      var(--red) 10px 20px,
      var(--surface) 20px 30px
    );
    opacity:0.9;
  }
  header.top{
    padding:22px 20px 16px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  header.top h1{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:3px;
    font-size:34px;
    margin:0;
    color:var(--gold);
  }
  header.top p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.5px;
  }
  .tabs{
    display:flex;
    max-width:520px;
    margin:16px auto 0;
    padding:0 16px;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    padding:11px 8px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.3px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#1b1917;
  }
  main{
    max-width:520px;
    margin:20px auto;
    padding:0 16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1.5px;
    font-size:20px;
    margin:0 0 12px;
    color:var(--text);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .date-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:thin;
  }
  .date-pill{
    flex:0 0 auto;
    padding:10px 12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    text-align:center;
    cursor:pointer;
    min-width:56px;
    transition:all .15s ease;
  }
  .date-pill .d{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .date-pill .n{font-size:18px;font-weight:700;font-family:'Inter',sans-serif;}
  .date-pill.selected{
    background:var(--gold);
    border-color:var(--gold);
  }
  .date-pill.selected .d, .date-pill.selected .n{color:#1b1917;}

  .slot-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(78px,1fr));
    gap:8px;
    margin-top:10px;
  }
  .slot{
    padding:9px 4px;
    text-align:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .slot:hover:not(.taken){border-color:var(--gold);}
  .slot.selected{background:var(--gold);border-color:var(--gold);color:#1b1917;font-weight:700;}
  .slot.taken{
    background:transparent;
    color:var(--muted);
    text-decoration:line-through;
    cursor:not-allowed;
    opacity:0.5;
  }

  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin:12px 0 5px;
    font-weight:600;
  }
  input[type=text], input[type=tel], select{
    width:100%;
    padding:11px 12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
  }
  input:focus, select:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .btn{
    display:inline-block;
    padding:12px 18px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:#1b1917;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    text-align:center;
    width:100%;
    margin-top:16px;
    transition:filter .12s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.secondary{
    background:transparent;
    color:var(--gold);
  }
  .btn.small{
    width:auto;
    padding:7px 12px;
    font-size:12.5px;
    margin-top:0;
  }
  .btn.ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--muted);
  }
  .btn.danger{
    background:transparent;
    border-color:var(--danger);
    color:var(--danger);
  }
  .btn.green{
    background:transparent;
    border-color:var(--green);
    color:var(--green);
  }

  .confirm-box{
    text-align:center;
    padding:10px 0 4px;
  }
  .confirm-box .check{
    width:56px;height:56px;border-radius:50%;
    background:var(--green);
    color:#1b1917;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 14px;
  }
  .confirm-summary{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    text-align:left;
    margin:14px 0;
    font-size:14px;
    line-height:1.9;
  }
  .confirm-summary b{color:var(--gold);}

  .status-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .status-dot{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;margin-right:8px;
  }
  .pin-gate{
    text-align:center;
    padding:30px 10px;
  }
  .pin-gate input{
    text-align:center;
    letter-spacing:6px;
    font-size:20px;
    font-family:'JetBrains Mono',monospace;
  }

  .appt-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    background:var(--surface-2);
  }
  .appt-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .appt-time{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--gold);
    font-size:16px;
  }
  .badge{
    font-size:10.5px;
    font-family:'JetBrains Mono',monospace;
    padding:2px 8px;
    border-radius:20px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .badge.active{background:rgba(201,162,75,.15);color:var(--gold);}
  .badge.done{background:rgba(111,157,106,.15);color:var(--green);}
  .badge.cancelled{background:rgba(181,69,59,.15);color:var(--danger);}
  .appt-name{font-weight:600;margin-top:4px;font-size:14.5px;}
  .appt-meta{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .appt-actions{
    display:flex;gap:8px;margin-top:10px;
  }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--muted);
    font-size:13.5px;
  }
  .next-up{
    background:linear-gradient(135deg, rgba(201,162,75,.12), transparent);
    border:1px solid var(--gold-dim);
  }
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .muted-small{color:var(--muted);font-size:12px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:12.5px;cursor:pointer;font-weight:600;padding:4px;}
  .loading-line{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}
  .err-line{color:var(--danger);font-size:12.5px;margin-top:6px;}
  .step-indicator{
    display:flex;gap:6px;margin-bottom:16px;
  }
  .step-indicator span{
    flex:1;height:3px;border-radius:3px;background:var(--border);
  }
  .step-indicator span.on{background:var(--gold);}
  .manual-form{
    margin-top:12px;
    border-top:1px dashed var(--border);
    padding-top:12px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="stripe-bar"></div>
  <header class="top">
    <h1>HARUN BERBER</h1>
    <p>Randevu Sistemi</p>
  </header>
  <div class="tabs">
    <button class="tab-btn" id="tabCustomer">Randevu Al</button>
    <button class="tab-btn" id="tabBarber">Berber Paneli</button>
  </div>
  <main id="main"></main>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ---------------- Supabase Bağlantısı ---------------- */
/* Aşağıdaki iki değeri kendi Supabase projenizin ayarlarıyla değiştirin.
   Supabase Dashboard > Project Settings > API bölümünden kopyalanır. */
const SUPABASE_URL = "https://nxsyutobfmrwxnvriwpe.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54c3l1dG9iZm1yd3hudnJpd3BlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDYyODAsImV4cCI6MjEwMDkyMjI4MH0.hdH1-aszZt9ufBka7VwTk_AbGjpeEHvVXiEZhWg4xRA";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- Config ---------------- */
const SERVICES = [
  {id:'sac', name:'Saç Kesimi'},
  {id:'sakal', name:'Sakal Tıraşı'},
  {id:'sac_sakal', name:'Saç + Sakal'},
  {id:'cocuk', name:'Çocuk Tıraşı'},
  {id:'fon', name:'Fön Çekimi'},
  {id:'boya', name:'Saç Boyama'},
  {id:'cilt', name:'Cilt / Yüz Bakımı'}
];
const WORK_START = '09:00';
const WORK_END = '20:00';
const SLOT_MIN = 30;
const BARBER_PIN = '3353';
const DAY_NAMES = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTH_NAMES = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const STATUS_OPTIONS = [
  {id:'bosta', label:'Boşta', color:'var(--green)'},
  {id:'mesgul', label:'Müşteriyle Meşgul', color:'var(--gold)'},
  {id:'molada', label:'Molada', color:'var(--blue)'},
  {id:'kapali', label:'Dükkan Kapalı', color:'var(--danger)'}
];

/* ---------------- State ---------------- */
let view = 'customer';
let barberUnlocked = false;
let appointmentsStore = null; // {dateStr: [ {id,time,name,phone,service,status,addedBy} ]}
let shopStatus = null; // {state, note, updatedAt}
let loadError = null;

let custSelectedDate = todayStr();
let custSelectedTime = null;
let custStep = 1;
let lastConfirmed = null;

let barberSelectedDate = todayStr();
let showManualForm = false;

let audioCtx = null;
let knownApptIds = null; // ilk yüklemeden sonra dolduğunda karşılaştırma için kullanılır

/* ---------------- Helpers ---------------- */
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function dateStrToDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatPill(dateStr){
  const d = dateStrToDate(dateStr);
  const isToday = dateStr === todayStr();
  const tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  const isTomorrow = dateStr === (tmr.getFullYear()+'-'+pad(tmr.getMonth()+1)+'-'+pad(tmr.getDate()));
  return {
    top: isToday ? 'BUGÜN' : (isTomorrow ? 'YARIN' : DAY_NAMES[d.getDay()]),
    num: d.getDate()+' '+MONTH_NAMES[d.getMonth()]
  };
}
function generateDateRange(days){
  const arr = [];
  const start = new Date();
  for(let i=0;i<days;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    arr.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
  }
  return arr;
}
function generateSlots(){
  const slots = [];
  let [h,m] = WORK_START.split(':').map(Number);
  const [eh,em] = WORK_END.split(':').map(Number);
  while(h < eh || (h===eh && m < em)){
    slots.push(pad(h)+':'+pad(m));
    m += SLOT_MIN;
    if(m>=60){m-=60;h++;}
  }
  return slots;
}
const ALL_SLOTS = generateSlots();
function serviceName(id){
  const s = SERVICES.find(x=>x.id===id);
  return s ? s.name : id;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------------- Ses Uyarısı ---------------- */
function ensureAudioContext(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
}
function playAlertSound(){
  ensureAudioContext();
  if(!audioCtx) return;
  const beep = (startTime, freq)=>{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.35, startTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime+0.28);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime+0.3);
  };
  const now = audioCtx.currentTime;
  beep(now, 880);
  beep(now+0.32, 1046);
}
function collectApptIds(store){
  const ids = new Set();
  if(!store) return ids;
  for(const date in store){
    (store[date]||[]).forEach(a=>{
      if(a.status === 'active' && a.addedBy === 'customer') ids.add(date+':'+a.id);
    });
  }
  return ids;
}

/* ---------------- Storage I/O (Supabase) ---------------- */
async function fetchLatestAppointments(){
  try{
    const { data, error } = await supabase.from('app_state').select('data').eq('id','appointments').single();
    if(error) throw error;
    return (data && data.data) ? data.data : {};
  }catch(e){
    return appointmentsStore || {};
  }
}
async function fetchLatestStatus(){
  try{
    const { data, error } = await supabase.from('app_state').select('data').eq('id','status').single();
    if(error) throw error;
    return (data && data.data) ? data.data : {state:'bosta', updatedAt: Date.now()};
  }catch(e){
    return shopStatus || {state:'bosta', updatedAt: Date.now()};
  }
}
async function saveAppointments(){
  try{
    const { error } = await supabase.from('app_state').upsert({id:'appointments', data: appointmentsStore});
    if(error) throw error;
    return true;
  }catch(e){
    return false;
  }
}
async function saveStatus(){
  try{
    const { error } = await supabase.from('app_state').upsert({id:'status', data: shopStatus});
    if(error) throw error;
    return true;
  }catch(e){
    return false;
  }
}
function getDayAppts(dateStr){
  return (appointmentsStore && appointmentsStore[dateStr]) ? appointmentsStore[dateStr] : [];
}
function takenTimesForDate(dateStr){
  return getDayAppts(dateStr).filter(a=>a.status!=='cancelled').map(a=>a.time);
}

/* ---------------- Render root ---------------- */
async function loadAll(){
  loadError = null;
  try{
    appointmentsStore = await fetchLatestAppointments();
  }catch(e){
    appointmentsStore = appointmentsStore || {};
    loadError = 'Randevular yüklenemedi. Supabase bağlantısını kontrol edin.';
  }
  shopStatus = await fetchLatestStatus();
}
async function init(){
  try{
    if(localStorage.getItem('harunBerberAuth') === '1'){
      barberUnlocked = true;
    }
  }catch(e){ /* localStorage kapalıysa sorun değil, PIN her seferinde sorulur */ }

  render(); // loading state
  await loadAll();
  knownApptIds = collectApptIds(appointmentsStore); // ilk yüklemede alarm çalmasın
  render();

  setInterval(async ()=>{
    // Müşteri bilgi formunu doldururken (adım 3) otomatik yenileme yapma,
    // aksi halde yazılan bilgiler ekran yenilenince silinir.
    if(view === 'customer' && custStep === 3 && !lastConfirmed) return;
    await loadAll();
    const newIds = collectApptIds(appointmentsStore);
    if(barberUnlocked){
      let hasNew = false;
      newIds.forEach(id=>{ if(!knownApptIds.has(id)) hasNew = true; });
      if(hasNew) playAlertSound();
    }
    knownApptIds = newIds;
    render();
  }, 5000);
}

function setView(v){
  view = v;
  ensureAudioContext();
  render();
}
document.getElementById('tabCustomer').addEventListener('click', ()=>setView('customer'));
document.getElementById('tabBarber').addEventListener('click', ()=>setView('barber'));

function render(){
  document.getElementById('tabCustomer').classList.toggle('active', view==='customer');
  document.getElementById('tabBarber').classList.toggle('active', view==='barber');
  const main = document.getElementById('main');
  if(appointmentsStore === null){
    main.innerHTML = `<div class="loading-line">Yükleniyor…</div>`;
    return;
  }
  main.innerHTML = view === 'customer' ? renderCustomer() : renderBarber();
  attachHandlers();
}

/* ---------------- Customer View ---------------- */
function renderCustomer(){
  const dates = generateDateRange(14);
  let statusBanner = '';
  if(shopStatus && (shopStatus.state === 'mesgul' || shopStatus.state === 'kapali')){
    const opt = STATUS_OPTIONS.find(o=>o.id===shopStatus.state);
    statusBanner = `<div class="card" style="border-color:${opt.color};padding:12px 16px;">
      <span class="status-dot" style="background:${opt.color}"></span>
      <span style="font-size:13px;">Berber şu anda: <b>${opt.label}</b>${shopStatus.state==='kapali' ? ' — yeni randevu alımı geçici olarak uygun olmayabilir.' : ', küçük gecikmeler olabilir.'}</span>
    </div>`;
  }

  if(lastConfirmed){
    const c = lastConfirmed;
    return `
      ${statusBanner}
      <div class="card confirm-box">
        <div class="check">✓</div>
        <h2>Randevunuz Alındı</h2>
        <div class="confirm-summary">
          <div><b>Tarih:</b> ${formatPill(c.date).num}</div>
          <div><b>Saat:</b> ${c.time}</div>
          <div><b>Ad Soyad:</b> ${escapeHtml(c.name)}</div>
          <div><b>Telefon:</b> ${escapeHtml(c.phone)}</div>
          <div><b>İşlem:</b> ${serviceName(c.service)}</div>
        </div>
        <button class="btn" id="newApptBtn">Yeni Randevu Al</button>
      </div>
    `;
  }

  const steps = `<div class="step-indicator">
    <span class="${custStep>=1?'on':''}"></span>
    <span class="${custStep>=2?'on':''}"></span>
    <span class="${custStep>=3?'on':''}"></span>
  </div>`;

  let dateHtml = `<div class="card">
    <div class="eyebrow">Adım 1</div>
    <h2>Tarih Seçin</h2>
    ${steps}
    <div class="date-row">
      ${dates.map(d=>{
        const p = formatPill(d);
        return `<div class="date-pill ${d===custSelectedDate?'selected':''}" data-date="${d}">
          <div class="d">${p.top}</div>
          <div class="n">${p.num.split(' ')[0]}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  let timeHtml = '';
  if(custSelectedDate){
    const taken = takenTimesForDate(custSelectedDate);
    timeHtml = `<div class="card">
      <div class="eyebrow">Adım 2</div>
      <h2>Saat Seçin</h2>
      <div class="slot-grid">
        ${ALL_SLOTS.map(t=>{
          const isTaken = taken.includes(t);
          const isPast = custSelectedDate === todayStr() && isPastTime(t);
          const disabled = isTaken || isPast;
          return `<div class="slot ${custSelectedTime===t?'selected':''} ${disabled?'taken':''}" ${disabled?'':`data-time="${t}"`}>${t}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let formHtml = '';
  if(custSelectedTime){
    formHtml = `<div class="card">
      <div class="eyebrow">Adım 3</div>
      <h2>Bilgileriniz</h2>
      <label for="custName">Ad Soyad</label>
      <input type="text" id="custName" placeholder="Örn. Ahmet Yılmaz" maxlength="60">
      <label for="custPhone">Telefon Numarası</label>
      <input type="tel" id="custPhone" placeholder="Örn. 0555 123 45 67" maxlength="20">
      <label for="custService">İşlem</label>
      <select id="custService">
        ${SERVICES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}
      </select>
      <div id="custFormErr" class="err-line"></div>
      <button class="btn" id="confirmApptBtn">Randevuyu Onayla — ${formatPill(custSelectedDate).num}, ${custSelectedTime}</button>
    </div>`;
  }

  return statusBanner + dateHtml + timeHtml + formHtml;
}

function isPastTime(t){
  const now = new Date();
  const [h,m] = t.split(':').map(Number);
  const slotDate = new Date();
  slotDate.setHours(h,m,0,0);
  return slotDate.getTime() < now.getTime();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Barber View ---------------- */
function renderBarber(){
  if(!barberUnlocked){
    return `<div class="card pin-gate">
      <div class="eyebrow">Berber Girişi</div>
      <h2>PIN Kodunu Girin</h2>
      <input type="text" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric">
      <div id="pinErr" class="err-line"></div>
      <button class="btn" id="pinSubmit">Giriş Yap</button>

    </div>`;
  }

  const opt = STATUS_OPTIONS.find(o=>o.id === (shopStatus ? shopStatus.state : 'bosta')) || STATUS_OPTIONS[0];
  const statusCard = `<div class="card status-card">
    <div>
      <div class="eyebrow">Anlık Durum</div>
      <div><span class="status-dot" style="background:${opt.color}"></span><b>${opt.label}</b></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <select id="statusSelect" style="width:auto;">
        ${STATUS_OPTIONS.map(o=>`<option value="${o.id}" ${o.id===opt.id?'selected':''}>${o.label}</option>`).join('')}

    </div>
  </div>`;

  const nextAppt = findNextAppt();

  if(nextAppt){
    nextHtml = `<div class="card next-up">
      <div class="eyebrow">Sıradaki Randevu</div>
      <div class="appt-top">
        <span class="appt-time">${nextAppt.time}</span>
        <span class="muted-small">${formatPill(nextAppt.date).num}</span>
      </div>
      <div class="appt-name">${escapeHtml(nextAppt.name)}</div>
      <div class="appt-meta">${serviceName(nextAppt.service)} · <a href="tel:${escapeHtml(nextAppt.phone)}" style="color:var(--gold)">${escapeHtml(nextAppt.phone)}</a></div>
      <div class="appt-actions">
        <button class="btn small green" data-act="done" data-date="${nextAppt.date}" data-id="${nextAppt.id}">Tamamlandı</button>
        <button class="btn small danger" data-act="cancel" data-date="${nextAppt.date}" data-id="${nextAppt.id}">İptal Et</button>
      </div>
    </div>`;
  } else {
    nextHtml = `<div class="card"><div class="empty-state">Yaklaşan randevu yok.</div></div>`;
  }

  const dates = generateDateRange(14);
  const dateRow = `<div class="card">
    <div class="top-actions">
      <div class="eyebrow" style="margin-bottom:0;">Programı Görüntüle</div>
      <button class="link-btn" id="refreshBtn">Yenile</button>
    </div>
    <div class="date-row">
      ${dates.map(d=>{
        const p = formatPill(d);
        const count = getDayAppts(d).filter(a=>a.status!=='cancelled').length;
        return `<div class="date-pill ${d===barberSelectedDate?'selected':''}" data-bdate="${d}">
          <div class="d">${p.top}</div>
          <div class="n">${p.num.split(' ')[0]}</div>
          ${count>0?`<div class="muted-small" style="font-size:10px;margin-top:2px;">${count} rdv</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  const dayAppts = getDayAppts(barberSelectedDate).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const reportCard = `<div class="card">
    <div class="row-between" style="margin-bottom:2px;">
      <div class="eyebrow" style="margin-bottom:0;">Günlük Rapor</div>
    </div>
    <div class="muted-small" style="margin-bottom:10px;">${formatPill(barberSelectedDate).top} · ${formatPill(barberSelectedDate).num} tarihi için özet oluştur</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn small ghost" id="printReportBtn">🖨️ Yazdır / PDF</button>
      <button class="btn small ghost" id="downloadReportBtn">⬇ TXT İndir</button>
    </div>
  </div>`;

  const listHtml = `<div class="card">
    <div class="row-between" style="margin-bottom:10px;">
      <h2 style="margin:0;">${formatPill(barberSelectedDate).top} · ${formatPill(barberSelectedDate).num}</h2>
      <button class="btn small ghost" id="toggleManualBtn">${showManualForm ? 'Kapat' : '+ Randevu Ekle'}</button>
    </div>
    ${showManualForm ? manualFormHtml() : ''}
    ${dayAppts.length === 0 ? `<div class="empty-state">Bu tarihte randevu yok.</div>` :
      dayAppts.map(a=>`
      <div class="appt-item">
        <div class="appt-top">
          <span class="appt-time">${a.time}</span>
          <span class="badge ${a.status}">${a.status==='active'?'Bekliyor':a.status==='done'?'Tamamlandı':'İptal'}</span>
        </div>
        <div class="appt-name">${escapeHtml(a.name)}</div>
        <div class="appt-meta">${serviceName(a.service)} · <a href="tel:${escapeHtml(a.phone)}" style="color:var(--gold)">${escapeHtml(a.phone)}</a> ${a.addedBy==='barber' ? '· <span style="color:var(--muted)">berber tarafından eklendi</span>' : ''}</div>
        ${a.status==='active' ? `<div class="appt-actions">
          <button class="btn small green" data-act="done" data-date="${barberSelectedDate}" data-id="${a.id}">Tamamlandı</button>
          <button class="btn small danger" data-act="cancel" data-date="${barberSelectedDate}" data-id="${a.id}">İptal Et</button>
        </div>` : `<div class="appt-actions">
          <button class="btn small ghost" data-act="delete" data-date="${barberSelectedDate}" data-id="${a.id}">Sil</button>
        </div>`}
      </div>
    `).join('')}
  </div>`;

  return statusCard + nextHtml + dateRow + reportCard + listHtml;
}

function manualFormHtml(){
  const taken = takenTimesForDate(barberSelectedDate);
  const free = ALL_SLOTS.filter(t=>!taken.includes(t));
  return `<div class="manual-form">
    <label for="mName">Ad Soyad</label>
    <input type="text" id="mName" placeholder="Müşteri adı">
    <label for="mPhone">Telefon</label>
    <input type="tel" id="mPhone" placeholder="Telefon numarası">
    <label for="mService">İşlem</label>
    <select id="mService">${SERVICES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
    <label for="mTime">Saat</label>
    <select id="mTime">
      ${free.length === 0 ? `<option value="">Uygun saat yok</option>` : free.map(t=>`<option value="${t}">${t}</option>`).join('')}
    </select>
    <div id="mErr" class="err-line"></div>
    <button class="btn" id="mSubmit" ${free.length===0?'disabled':''}>Randevuyu Ekle</button>
  </div>`;
}

function findNextAppt(){
  const dates = generateDateRange(14);
  const now = new Date();
  for(const d of dates){
    const list = getDayAppts(d).filter(a=>a.status==='active').sort((a,b)=>a.time.localeCompare(b.time));
    for(const a of list){
      if(d === todayStr()){
        const [h,m] = a.time.split(':').map(Number);
        const slotDate = new Date(); slotDate.setHours(h,m,0,0);
        if(slotDate.getTime() < now.getTime()) continue;
      }
      return {...a, date:d};
    }
  }
  return null;
}

/* ---------------- Günlük Rapor ---------------- */
function buildReportData(dateStr){
  const appts = getDayAppts(dateStr).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const total = appts.length;
  const done = appts.filter(a=>a.status==='done').length;
  const cancelled = appts.filter(a=>a.status==='cancelled').length;
  const active = appts.filter(a=>a.status==='active').length;
  const serviceCounts = {};
  appts.forEach(a=>{
    if(a.status !== 'cancelled'){
      serviceCounts[a.service] = (serviceCounts[a.service]||0) + 1;
    }
  });
  return {appts, total, done, cancelled, active, serviceCounts};
}
function statusLabel(s){
  return s === 'active' ? 'Bekliyor' : s === 'done' ? 'Tamamlandı' : 'İptal';
}
function printDailyReport(dateStr){
  const data = buildReportData(dateStr);
  const label = formatPill(dateStr).num;
  const rows = data.appts.map(a=>`
    <tr>
      <td>${a.time}</td>
      <td>${escapeHtml(a.name)}</td>
      <td>${escapeHtml(a.phone)}</td>
      <td>${serviceName(a.service)}</td>
      <td>${statusLabel(a.status)}</td>
    </tr>`).join('');
  const serviceRows = Object.entries(data.serviceCounts)
    .map(([sid,count])=>`<tr><td>${serviceName(sid)}</td><td>${count}</td></tr>`).join('');
  const html = `<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Günlük Rapor - ${label}</title>
  <style>
    body{font-family:Arial, Helvetica, sans-serif; padding:24px; color:#1b1917;}
    h1{font-size:20px;margin-bottom:2px;}
    .sub{color:#555;margin-bottom:10px;}
    h2{font-size:15px;margin-top:26px;margin-bottom:8px;border-bottom:1px solid #ccc;padding-bottom:4px;}
    table{width:100%;border-collapse:collapse;margin-top:6px;}
    th,td{border:1px solid #ccc;padding:6px 8px;font-size:13px;text-align:left;}
    th{background:#f2f2f2;}
    .summary{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
    .summary div{background:#f7f7f7;border:1px solid #ddd;border-radius:6px;padding:8px 16px;font-size:13px;min-width:90px;}
    .summary b{display:block;font-size:20px;}
    @media print{ body{padding:10px;} }
  </style></head><body>
  <h1>Harun Berber — Günlük Rapor</h1>
  <div class="sub">${label}</div>
  <div class="summary">
    <div><b>${data.total}</b>Toplam Randevu</div>
    <div><b>${data.done}</b>Tamamlandı</div>
    <div><b>${data.active}</b>Bekliyor</div>
    <div><b>${data.cancelled}</b>İptal</div>
  </div>
  <h2>Hizmet Dağılımı</h2>
  <table><tr><th>Hizmet</th><th>Adet</th></tr>${serviceRows || '<tr><td colspan="2">Kayıt yok</td></tr>'}</table>
  <h2>Randevu Listesi</h2>
  <table><tr><th>Saat</th><th>Ad Soyad</th><th>Telefon</th><th>Hizmet</th><th>Durum</th></tr>${rows || '<tr><td colspan="5">Bu tarihte randevu yok</td></tr>'}</table>
  </body></html>`;
  const win = window.open('', '_blank');
  if(!win){
    alert('Yazdırma penceresi açılamadı. Tarayıcınızın açılır pencere engelleyicisini kontrol edin.');
    return;
  }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 350);
}
function downloadDailyReportTxt(dateStr){
  const data = buildReportData(dateStr);
  const label = formatPill(dateStr).num;
  let text = `HARUN BERBER - GÜNLÜK RAPOR\n${label}\n\n`;
  text += `Toplam Randevu: ${data.total}\nTamamlandı: ${data.done}\nBekliyor: ${data.active}\nİptal: ${data.cancelled}\n\n`;
  text += `Hizmet Dağılımı:\n`;
  if(Object.keys(data.serviceCounts).length === 0){
    text += `(kayıt yok)\n`;
  } else {
    Object.entries(data.serviceCounts).forEach(([sid,count])=>{
      text += `- ${serviceName(sid)}: ${count}\n`;
    });
  }
  text += `\nRandevu Listesi:\n`;
  if(data.appts.length === 0){
    text += `(bu tarihte randevu yok)\n`;
  } else {
    data.appts.forEach(a=>{
      text += `${a.time} | ${a.name} | ${a.phone} | ${serviceName(a.service)} | ${statusLabel(a.status)}\n`;
    });
  }
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `harun-berber-rapor-${dateStr}.txt`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ---------------- Event Handlers ---------------- */
function attachHandlers(){
  // Customer date pills
  document.querySelectorAll('[data-date]').forEach(el=>{
    el.addEventListener('click', ()=>{
      custSelectedDate = el.getAttribute('data-date');
      custSelectedTime = null;
      custStep = 2;
      render();
    });
  });
  // Customer time slots
  document.querySelectorAll('[data-time]').forEach(el=>{
    el.addEventListener('click', ()=>{
      custSelectedTime = el.getAttribute('data-time');
      custStep = 3;
      render();
      setTimeout(()=>{ const n=document.getElementById('custName'); if(n) n.focus(); }, 50);
    });
  });
  const confirmBtn = document.getElementById('confirmApptBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', submitCustomerAppt);
  }
  const newApptBtn = document.getElementById('newApptBtn');
  if(newApptBtn){
    newApptBtn.addEventListener('click', ()=>{
      lastConfirmed = null;
      custSelectedTime = null;
      custStep = 1;
      render();
    });
  }
  // Barber PIN
  const pinSubmit = document.getElementById('pinSubmit');
  if(pinSubmit){
    const pinInput = document.getElementById('pinInput');
    pinSubmit.addEventListener('click', ()=>{
      if(pinInput.value === BARBER_PIN){
        barberUnlocked = true;
        ensureAudioContext();
        try{ localStorage.setItem('harunBerberAuth', '1'); }catch(e){}
        render();
      } else {
        document.getElementById('pinErr').textContent = 'Hatalı PIN. Tekrar deneyin.';
      }
    });
    pinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') pinSubmit.click(); });
  }
  // Çıkış Yap
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', ()=>{
      barberUnlocked = false;
      try{ localStorage.removeItem('harunBerberAuth'); }catch(e){}
      render();
    });
  }
  // Status select
  const statusSelect = document.getElementById('statusSelect');
  if(statusSelect){
    statusSelect.addEventListener('change', async ()=>{
      shopStatus = {state: statusSelect.value, updatedAt: Date.now()};
      await saveStatus();
      render();
    });
  }
  // Refresh
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn){
    refreshBtn.addEventListener('click', async ()=>{
      refreshBtn.textContent = '…';
      await loadAll();
      render();
    });
  }
  // Barber date pills
  document.querySelectorAll('[data-bdate]').forEach(el=>{
    el.addEventListener('click', ()=>{
      barberSelectedDate = el.getAttribute('data-bdate');
      showManualForm = false;
      render();
    });
  });
  // Toggle manual form
  const toggleManualBtn = document.getElementById('toggleManualBtn');
  if(toggleManualBtn){
    toggleManualBtn.addEventListener('click', ()=>{
      showManualForm = !showManualForm;
      render();
    });
  }
  // Günlük rapor
  const printReportBtn = document.getElementById('printReportBtn');
  if(printReportBtn){
    printReportBtn.addEventListener('click', ()=>printDailyReport(barberSelectedDate));
  }
  const downloadReportBtn = document.getElementById('downloadReportBtn');
  if(downloadReportBtn){
    downloadReportBtn.addEventListener('click', ()=>downloadDailyReportTxt(barberSelectedDate));
  }
  // Manual submit
  const mSubmit = document.getElementById('mSubmit');
  if(mSubmit){
    mSubmit.addEventListener('click', submitManualAppt);
  }
  // Appt actions (done/cancel/delete)
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const act = el.getAttribute('data-act');
      const date = el.getAttribute('data-date');
      const id = el.getAttribute('data-id');
      await updateApptStatus(date, id, act);
    });
  });
}

async function submitCustomerAppt(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const service = document.getElementById('custService').value;
  const errEl = document.getElementById('custFormErr');
  if(!name || name.length < 2){ errEl.textContent = 'Lütfen ad soyad girin.'; return; }
  if(!phone || phone.replace(/\D/g,'').length < 10){ errEl.textContent = 'Lütfen geçerli bir telefon numarası girin.'; return; }

  // re-check slot still free
  appointmentsStore = await fetchLatestAppointments();
  const taken = takenTimesForDate(custSelectedDate);
  if(taken.includes(custSelectedTime)){
    errEl.textContent = 'Bu saat az önce doldu, lütfen başka bir saat seçin.';
    custSelectedTime = null;
    render();
    return;
  }

  const appt = {id: uid(), time: custSelectedTime, name, phone, service, status:'active', addedBy:'customer'};
  if(!appointmentsStore[custSelectedDate]) appointmentsStore[custSelectedDate] = [];
  appointmentsStore[custSelectedDate].push(appt);
  const ok = await saveAppointments();
  if(!ok){ errEl.textContent = 'Randevu kaydedilemedi, lütfen tekrar deneyin.'; return; }

  lastConfirmed = {date: custSelectedDate, time: custSelectedTime, name, phone, service};
  render();
}

async function submitManualAppt(){
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const service = document.getElementById('mService').value;
  const time = document.getElementById('mTime').value;
  const errEl = document.getElementById('mErr');
  if(!name || name.length < 2){ errEl.textContent = 'Ad soyad girin.'; return; }
  if(!phone){ errEl.textContent = 'Telefon numarası girin.'; return; }
  if(!time){ errEl.textContent = 'Uygun saat yok.'; return; }

  appointmentsStore = await fetchLatestAppointments();
  const taken = takenTimesForDate(barberSelectedDate);
  if(taken.includes(time)){ errEl.textContent = 'Bu saat dolu, listeyi yenileyip tekrar deneyin.'; render(); return; }

  const appt = {id: uid(), time, name, phone, service, status:'active', addedBy:'barber'};
  if(!appointmentsStore[barberSelectedDate]) appointmentsStore[barberSelectedDate] = [];
  appointmentsStore[barberSelectedDate].push(appt);
  const ok = await saveAppointments();
  if(!ok){ errEl.textContent = 'Kaydedilemedi, tekrar deneyin.'; return; }
  showManualForm = false;
  render();
}

async function updateApptStatus(date, id, act){
  if(!appointmentsStore[date]) return;
  if(act === 'delete'){
    appointmentsStore[date] = appointmentsStore[date].filter(a=>a.id!==id);
  } else {
    const a = appointmentsStore[date].find(x=>x.id===id);
    if(!a) return;
    a.status = act === 'done' ? 'done' : 'cancelled';
  }
  await saveAppointments();
  render();
}

init();
